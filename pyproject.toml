[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firmata-client"
version = "0.1.0"
description = "Minimal Firmata protocol client for Arduino (StandardFirmata). Only depends on pyserial."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["arduino", "firmata", "serial", "hardware", "iot", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
"Homepage" = "https://github.com/username/firmata-client"
"Bug Tracker" = "https://github.com/username/firmata-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/firmata_client"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
